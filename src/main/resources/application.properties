spring.application.name=Proyecto

# Puerto de la aplicación
server.port=9091

# ==================================
# 2. CONFIGURACIÓN DE BASE DE DATOS
# ==================================
# ?? IMPORTANTE: Revisa tu pom.xml para confirmar que tienes la dependencia ojdbc (driver de Oracle).
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=C##PROYECTOSOCIAL
spring.datasource.password=123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ========================
# 3. CONFIGURACIÓN JPA / HIBERNATE
# ========================
# DDL Auto: 'update' es recomendable para desarrollo.
# Usa 'none' en Producción para evitar pérdida de datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Define el esquema por defecto para evitar prefijos en las tablas
spring.jpa.properties.hibernate.default_schema=C##PROYECTOSOCIAL
# Cierra la sesión inmediatamente después de cada transacción (buena práctica para REST APIs)
spring.jpa.open-in-view=false

# ========================
# 4. LOGS Y ERRORES
# ========================
# Nivel de log general
logging.level.root=INFO
# Nivel de log para tu paquete base (útil para debuggear tus Services y Repositories)
logging.level.pe.edu.upeu.proyeccionsocial=DEBUG 
# Guardar logs en un archivo (opcional)
logging.file.name=logs/proyeccion-social.log

# Configuración de errores para devolver mensajes útiles en el API
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always